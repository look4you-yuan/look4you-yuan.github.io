      <stop offset="1" stop-color="#1c5b8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#7fb0d8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7fb0d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
